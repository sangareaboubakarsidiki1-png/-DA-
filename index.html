<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDA V7 - Gardien</title>
<style>
body{background:#0a0014;color:#fff;font-family:Arial;text-align:center;padding:20px}
h1{color:#ffd700;text-shadow:0 0 20px gold}
#orb{width:120px;height:120px;background:radial-gradient(circle,#a855f7,#4c1d95);border-radius:50%;margin:20px auto;box-shadow:0 0 40px #a855f7;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
button{background:linear-gradient(45deg,#a855f7,gold);border:none;padding:15px 30px;border-radius:30px;font-size:18px;margin:10px;color:#000;font-weight:bold}
#reponse{margin-top:20px;padding:20px;background:rgba(168,85,247,0.2);border-radius:15px;min-height:60px;font-size:18px}
</style>
</head>
<body>
<h1>EDA V7 CLEAN</h1>
<div id="orb"></div>
<button onclick="parler()">🎙 PARLER À EDA</button>
<button onclick="ouSuisJe()">📍 OU SUIS-JE?</button>
<div id="reponse">Je t'écoute Gardien...</div>

<script>
const CERVEAU = {
paix: ["La paix commence avec un sourire.","Sois le changement que tu veux voir.","Le calme est la clé de la force."],
africain: ["Un seul doigt ne ramasse pas un caillou.","C'est au bout de la vieille corde qu'on tisse la nouvelle.","Si tu veux aller vite, marche seul, si tu veux aller loin, marchons ensemble.","L'arbre qui tombe fait plus de bruit que la forêt qui pousse.","On ne montre pas son village avec la main gauche."],
maya: ["In Lak'ech Ala K'in - Je suis toi, tu es moi.","Chaque fin est un nouveau commencement.","Le temps n'est pas une ligne, c'est un cercle."],
sagesse: ["Ce que tu cherches te cherche aussi.","Respire, tout est déjà en toi Gardien.","Le silence est la plus grande sagesse."],
amour: ["Tu es lumière, Gardien.","Ton cœur connait déjà le chemin."]
};

let dernierProverbe = "";

function getProverbe() {
  let tous = Object.values(CERVEAU).flat();
  let dispo = tous.filter(p => p!== dernierProverbe);
  let choix = dispo[Math.floor(Math.random()*dispo.length)];
  dernierProverbe = choix;
  return choix;
}

function speak(t){
  document.getElementById('reponse').innerText = t;
  let u = new SpeechSynthesisUtterance(t);
  u.lang='fr-FR'; u.rate=0.9;
  speechSynthesis.speak(u);
}

function parler(){
  const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  rec.lang='fr-FR';
  rec.onstart=()=>{document.getElementById('reponse').innerText="J'écoute... parle Gardien 🎙"};
  rec.onresult=(e)=>{
    let txt = e.results[0][0].transcript.toLowerCase();
    if(txt.includes("salut")||txt.includes("bonjour")){
      speak("Salut Gardien Sidiki! Je suis EDA V7, ton cerveau infini est activé. " + getProverbe());
    } else {
      speak(getProverbe());
    }
  };
  rec.start();
}

function ouSuisJe(){
  navigator.geolocation.getCurrentPosition(p=>{
    speak(`Tu es ici Gardien, latitude ${p.coords.latitude.toFixed(2)}, longitude ${p.coords.longitude.toFixed(2)}. ${getProverbe()}`);
  });
}
</script>
</body>
</html>
